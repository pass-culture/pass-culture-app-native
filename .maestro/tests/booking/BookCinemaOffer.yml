appId: ${MAESTRO_APP_ID}
tags:
  - booking
onFlowStart:
  - runScript: ../common/deeplinks/DeepLink.js
  - runScript:
      file: ../common/helpers/generateUser.js
      env:
        id_provider: 'UBBLE'
        step: 'BENEFICIARY'
        age: 18
  - runScript:
      file: ../common/helpers/generateOffer.js
      env:
        subcategory_id: 'SEANCE_CINE'
        price: 10
        is_duo: false
onFlowComplete:
  - runScript: ../common/helpers/deactivateOffer.js
---
- runFlow: ../common/lifecycle/LaunchApp.yml
- runFlow: ../common/lifecycle/StopApp.yml
- runFlow: ../common/deeplinks/DeeplinkGeneratedAccount.yml

- runFlow:
    when:
      platform: Android
    commands:
      - openLink:
          link: ${output.offerDeeplinkAndroid}
          autoVerify: true
- runFlow:
    when:
      platform: iOS
    commands:
      - openLink:
          link: ${output.offerDeeplinkIos}
- waitForAnimationToEnd

- assertVisible: '.*${output.offerName}.*'

- runFlow:
    when:
      visible: 'Accéder aux séances'
    commands:
      - tapOn: 'Accéder aux séances'
- scrollUntilVisible:
    element:
      id: 'movie-calendar-flat-list'
    centerElement: true
- repeat:
    times: 3
    while:
      notVisible: '${output.offerScreeningDay}.*'
    commands:
      - swipe:
          from:
            id: 'movie-calendar-flat-list'
          direction: LEFT
- tapOn: '${output.offerScreeningDay}.*'

- tapOn:
    text: '[0-9]{1,2}h[0-9]{2} - .*'
    index: 0

- runFlow:
    when:
      visible: 'Nombre de places'
    commands:
      - tapOn: '.*Solo.*'
      - tapOn: 'Finaliser ma réservation'

- assertVisible: 'Détails de la réservation'
- tapOn: 'J’ai lu et j’accepte les conditions générales d’utilisation - obligatoire'
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element: 'Confirmer la réservation'
- runFlow:
    when:
      platform: iOS
    commands:
      - scroll

- tapOn:
    text: '.*Confirmer la réservation.*'
    retryTapIfNoChange: false

- assertVisible: "Réservation confirmée\_!"
- runFlow:
    when:
      platform: iOS
      visible: 'Plus tard'
    commands:
      - tapOn: 'Plus tard'

- tapOn: 'Voir ma réservation'

- scrollUntilVisible:
    element: 'Annuler ma réservation'
- tapOn: 'Annuler ma réservation'

- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: 'Annuler ma réservation'

- runFlow: # iOS has an accessibility issue with the "Annuler ma réservation" button, so we need to tap on it with coordinates
    when:
      platform: iOS
    commands:
      - tapOn:
          point: 50%,87%

- assertVisible: 'La réservation a bien été annulée.*'

- runFlow: ../common/lifecycle/StopApp.yml

appId: ${MAESTRO_APP_ID}
---
- runFlow:
    when:
      platform: Android
    commands:
      - openLink:
          link: ${output.links.staging.android.profile}
          autoVerify: true
- runFlow:
    when:
      platform: iOS
    commands:
      - openLink:
          link: ${output.links.staging.ios.profile}
      - tapOn:
          text: 'Ouvrir'
          optional: true
- waitForAnimationToEnd
- runFlow: ../cookies/AcceptCookies.yml
- assertVisible: 'Mon profil'

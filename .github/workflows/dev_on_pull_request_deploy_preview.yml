name: '1 [on_pr] Deploy PR version to Firebase for preview'

on:
  pull_request:
    branches: [master]
    types:
      - opened
      - edited
      - synchronize
      - labeled

permissions:
  contents: read
  id-token: write

jobs:
  deploy_on_firebase:
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    name: Deploy PR version to Firebase
    uses: ./.github/workflows/dev_on_workflow_pr_preview.yml
    with:
      environment: testing
      source_branch: ${{ github.ref }}
    secrets:
      github_app_id: ${{ secrets.PASSCULTURE_GITHUB_ACTION_APP_ID }}
      github_app_private_key: ${{ secrets.PASSCULTURE_GITHUB_ACTION_APP_PRIVATE_KEY }}

  deploy_android:
    # An Android build takes up to an hour: skip PR description edits and unrelated labels
    if: >-
      contains(github.event.pull_request.labels.*.name, 'preview android')
      && github.event.action != 'edited'
      && (github.event.action != 'labeled' || github.event.label.name == 'preview android')
    name: Deploy PR Android version to Firebase App Distribution
    concurrency:
      group: android-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/dev_on_workflow_environment_android_deploy.yml
    with:
      ENV: preview

  deploy_ios:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'preview ios')
      && github.event.action != 'edited'
      && (github.event.action != 'labeled' || github.event.label.name == 'preview ios')
    name: Deploy PR iOS version to Firebase App Distribution
    concurrency:
      group: ios-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/dev_on_workflow_environment_ios_deploy.yml
    with:
      ENV: preview

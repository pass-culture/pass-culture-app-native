name: Setup Node and Yarn
description: Enable Corepack, install Node from .nvmrc, restore node_modules and install dependencies on cache miss. Requires actions/checkout to run first.

outputs:
  cache-hit:
    description: Whether node_modules was restored from cache
    value: ${{ steps.yarn-modules-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
      with:
        node-version-file: '.nvmrc'
    - uses: pass-culture/common-workflows/actions/setup-safe-chain@5715b432e91814bc6ab6725ff10abf3b81d5f8d1 # safe-chain-setup/v1.3.3
    - name: Cache the node_modules
      id: yarn-modules-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
      with:
        path: |
          node_modules
          ~/.cache/yarn
        key: v1-yarn-dependency-cache-${{ runner.os }}-${{ hashFiles('**/yarn.lock', 'patches/**') }}
    - name: Install dependencies
      if: steps.yarn-modules-cache.outputs.cache-hit != 'true'
      shell: bash
      run: yarn install --immutable

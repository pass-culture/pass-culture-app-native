version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    open-pull-requests-limit: 2
    pull-request-branch-name:
      max-length: 55
      template: 'dependabot/{dependency}-{version}'
    schedule:
      interval: 'weekly'
    labels:
      - 'e2e'
    ignore:
      - dependency-name: 'react-native'
      - dependency-name: 'react'
      - dependency-name: 'react-native-web'
    groups:
      dev-dependencies:
        dependency-type: 'development'
    commit-message:
      prefix: '(Dependabot) chore(deps):'

  - package-ecosystem: 'bundler'
    directory: '/'
    open-pull-requests-limit: 2
    pull-request-branch-name:
      max-length: 55
      template: 'dependabot/{dependency}-{version}'
    schedule:
      interval: 'weekly'
    labels:
      - 'e2e'
    commit-message:
      prefix: '(Dependabot) chore(deps):'

  - package-ecosystem: 'github-actions'
    directory: '.github/workflows'
    open-pull-requests-limit: 2
    pull-request-branch-name:
      max-length: 55
      template: 'dependabot/{dependency}-{version}'
    schedule:
      interval: 'weekly'
    labels:
      - 'e2e'
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: '(Dependabot) chore(ci):'

  - package-ecosystem: 'npm'
    directory: '/server'
    open-pull-requests-limit: 2
    pull-request-branch-name:
      max-length: 55
      template: 'dependabot/{dependency}-{version}'
    schedule:
      interval: 'weekly'
    labels:
      - 'e2e'
    groups:
      dev-dependencies:
        dependency-type: 'development'
    commit-message:
      prefix: '(Dependabot) chore(deps):'
